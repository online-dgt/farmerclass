<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Rye&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root[data-theme="dark"]{--bg:#191209;--fg:#f2e9d8;--mut:#a3927a;--card:#241a10;--ln:#3a2c1a;--inv:#f2e9d8;--invf:#191209;--ph:#2b2013}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#20160c;color:#f2e9d8}
.hd{display:flex;align-items:center;gap:14px;padding:10px 16px;max-width:1200px;margin:auto;flex-wrap:wrap}
.logo{font:400 26px 'Rye',Georgia,serif;color:#e0a458;letter-spacing:1px;cursor:pointer;background:none;border:0}
.logo small{font:600 10px Inter;letter-spacing:3px;color:#cbb896;margin-left:6px}
.se{flex:1;min-width:140px;background:#2c2013;border:1px solid #4a3a24;border-radius:99px;padding:8px 14px;color:#fff;order:2}
nav{display:flex;gap:4px;order:3;width:100%;overflow-x:auto}nav button{background:none;border:0;color:#dcd0b8;padding:6px 12px;white-space:nowrap;border-radius:99px}nav button:hover{color:#e0a458}
.cb{background:none;border:1px solid #4a3a24;color:#fff;border-radius:99px;padding:8px 14px;order:2}

.wrap{max-width:1200px;margin:auto;padding:0 16px}
.hero{background:radial-gradient(circle at 75% 30%,#3a2814,#1a1108 60%);color:#f2e9d8;padding:64px 16px;text-align:center}
.hero h1{font-size:clamp(34px,7vw,66px);margin:8px 0;line-height:1.05}.hero h1 em{color:#e0a458;font-style:normal}
.hero p{max-width:480px;margin:0 auto 24px;color:#cbb896}.eb{letter-spacing:4px;font-size:11px;color:#e0a458}
.btn{background:var(--inv);color:var(--invf);border:1px solid var(--inv);padding:12px 22px;border-radius:4px;font-weight:600}
.btn.o{background:none;color:var(--fg);border-color:var(--fg)}.hero .btn{background:#e0a458;color:#231a10;border-color:#e0a458}.hero .btn.o{background:none;color:#f2e9d8;border-color:#f2e9d8}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}

.sec{margin:36px 0}.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.sh h2{margin:0;font-size:28px}
.sh button{background:none;border:0;color:var(--mut);text-decoration:underline}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}@media(min-width:1000px){.grid.g4{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--ln);border-radius:6px;overflow:hidden;cursor:pointer;transition:transform .15s}.card:hover{transform:translateY(-3px)}
.ph{background:var(--ph);position:relative;aspect-ratio:1}.ph svg{width:100%;height:100%;padding:10%}
.bd{position:absolute;top:8px;left:8px;background:#231a10;color:#f2e9d8;font-size:11px;padding:2px 8px;border-radius:99px;letter-spacing:1px}
.ci{padding:10px 12px 14px}.ci small{color:var(--mut);font-size:12px}.ci h3{margin:2px 0 4px;font-size:15px;font-weight:500}
.pr{font-weight:600}.pr s{color:var(--mut);font-weight:400;margin-left:8px;font-size:13px}
.dots{display:flex;gap:5px;margin-top:8px}.dots i{width:12px;height:12px;border-radius:50%;border:1px solid var(--ln)}
.ben{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;text-align:center;border-block:1px solid var(--ln);padding:22px 0;margin:36px 0;color:var(--mut)}.ben b{display:block;color:var(--fg)}
footer{background:#20160c;color:#cbb896;text-align:center;padding:32px 16px;font-size:13px;margin-top:48px}
.shop{display:grid;gap:20px;margin-top:16px}@media(min-width:800px){.shop{grid-template-columns:220px 1fr}#fl{display:block!important}.ft{display:none}}
#fl{display:none;background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:14px;height:max-content}#fl.open{display:block}
#fl h4{margin:14px 0 6px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--mut)}#fl h4:first-child{margin-top:0}
.ch{display:inline-block;border:1px solid var(--ln);background:none;border-radius:99px;padding:4px 12px;margin:0 4px 6px 0;font-size:13px}.ch.on{background:var(--inv);color:var(--invf);border-color:var(--inv)}
.cl{display:block;background:none;border:0;padding:3px 0;text-align:left;color:var(--mut);width:100%}.cl.on{color:var(--fg);font-weight:600}
.sw{width:26px;height:26px;border-radius:50%;border:1px solid var(--ln);margin:0 6px 6px 0;padding:0}.sw.on{outline:2px solid var(--fg);outline-offset:2px}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar select{background:var(--card);border:1px solid var(--ln);border-radius:4px;padding:6px}.bar .btn{padding:6px 14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:50;align-items:center;justify-content:center;padding:12px}.ov.on{display:flex}
.md{background:var(--bg);border-radius:8px;max-width:820px;width:100%;max-height:92vh;overflow:auto;position:relative;display:grid}
@media(min-width:700px){.md.two{grid-template-columns:1fr 1fr}}
.md .ph{aspect-ratio:1}.mi{padding:20px}.mi h2{margin:0 0 4px;font-size:30px}
.x{position:absolute;top:8px;right:10px;background:var(--card);border:1px solid var(--ln);border-radius:50%;width:32px;height:32px;z-index:2}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.row .btn{flex:1;min-width:150px}
.dr{margin-left:auto;align-self:stretch;max-width:400px;width:100%;border-radius:0;display:flex;flex-direction:column}.ov.dw{padding:0}
.it{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--ln);align-items:center}.it .th{width:60px;height:60px;background:var(--ph);border-radius:4px;flex:none}.it .th svg{width:100%;height:100%;padding:6px}
.q button{width:24px;height:24px;border:1px solid var(--ln);background:none;border-radius:4px}
.tt{display:flex;justify-content:space-between;padding:3px 0}.tt.b{font-weight:600;font-size:17px}
#ts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#231a10;color:#fff;padding:10px 18px;border-radius:99px;z-index:99;display:none;border:1px solid var(--ac)}
</style></head><body>
<header><div class="hd"><button class="logo" onclick="go('home')">FARMERCLASS<small>COUNTRY STORE</small></button>

<footer><div class="logo" style="cursor:default">FARMERCLASS</div>Moda country para ele e para ela · Compra 100% segura<div style="margin:10px 0"><a href="https://www.instagram.com/farmerclass_/" target="_blank" rel="noopener" style="color:#e0a458">Instagram @farmerclass_</a> · <a href="https://api.whatsapp.com/send/?phone=556793149797&type=phone_number&app_absent=0" target="_blank" rel="noopener" style="color:#e0a458">WhatsApp</a></div>© 2026 Farmerclass. Todos os direitos reservados.</footer>
<div class="ov" id="mo" onclick="if(event.target==this)cl()"><div class="md two" id="md"></div></div>
<div class="ov dw" id="dr" onclick="if(event.target==this)cl()"><div class="md dr" id="dc"></div></div>
<div class="ov" id="ck" onclick="if(event.target==this)cl()"><div class="md" id="cc"></div></div>
<div id="ts"></div>
<script>
const $=s=>document.querySelector(s),R=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const CM={p:['Preto','#161616'],b:['Cru','#f3ecd8'],e:['Caqui','#c9a876'],c:['Marrom','#6b4226'],a:['Azul Jeans','#3a5a7d']},CH={};Object.values(CM).forEach(([n,h])=>CH[n]=h);
const CATS={M:['Camisas Country','Camisetas','Calças Jeans','Jaquetas','Botas','Chapéus','Cintos'],F:['Vestidos','Saias','Blusas','Calças Jeans','Shorts','Botas','Chapéus']};
const SH={M:['39','40','41','42','43'],F:['35','36','37','38','39']};
const PA={'Camisas Country':'M30 20L42 14Q50 22 58 14L70 20L84 34L74 44L68 38V84H32V38L26 44L16 34Z',Camisetas:'M30 20L42 14Q50 22 58 14L70 20L84 34L74 44L68 38V84H32V38L26 44L16 34Z',Blusas:'M36 14H44Q50 26 56 14H64L66 84H34Z','Calças Jeans':'M30 12H70L74 90H54L50 40L46 90H26Z',Jaquetas:'M30 18L42 12Q50 20 58 12L70 18L88 70L76 74L68 46V84H32V46L24 74L12 70Z',Bermudas:'M28 22H72L78 70H54L50 46L46 70H22Z',Shorts:'M28 26H72L78 62H54L50 44L46 62H22Z',Vestidos:'M40 10H46L50 20L54 10H60L58 34L78 84H22L42 34Z',Saias:'M38 20H62L82 80H18Z',Botas:'M28 10H54V46L74 54Q86 58 86 70V86H18V58L28 52Z',Chapéus:'M8 62Q50 82 92 62Q92 68 50 76Q8 68 8 62Z M30 26Q50 8 70 26Q70 48 50 52Q30 48 30 26Z',Cintos:'M8 40H92V58H8Z M40 32H60V66H40Z'};
const DS={'Camisas Country':'Camisa em tecido resistente com estampa xadrez ou lisa, corte confortável e acabamento em botões. Um clássico do guarda-roupa country.',Camisetas:'Camiseta de algodão macio com modelagem confortável. Básico versátil para o dia a dia na fazenda ou na cidade.',Blusas:'Blusa leve com detalhes bordados, ideal para compor looks country do dia a dia ao passeio no campo.','Calças Jeans':'Calça jeans de qualidade, caimento perfeito e durabilidade para o trabalho e o lazer.',Jaquetas:'Jaqueta reforçada, em jeans ou couro, para enfrentar o frio com estilo autêntico.',Bermudas:'Bermuda de sarja resistente, confortável para dias quentes no campo ou na cidade.',Shorts:'Short jeans com caimento descontraído, perfeito para o verão country.',Vestidos:'Vestido leve com estampas country, caimento fluido e acabamento cuidadoso.',Saias:'Saia com pegada rústica e elegante, versátil do casual ao mais arrumado.',Botas:'Bota de couro legítimo, resistente e confortável, feita para durar. Um símbolo do estilo country.',Chapéus:'Chapéu artesanal, ideal para proteger do sol com muito estilo rural.',Cintos:'Cinto de couro legítimo com fivela reforçada, o acabamento perfeito para o look country.'};
const DATA=`Camisa Country Xadrez|M|Camisas Country|159.9|199.9|pec|no
Camisa Country Lisa|M|Camisas Country|139.9|0|pbc|v
Camiseta Rural Basic|M|Camisetas|69.9|0|pbe|v
Camiseta Estampa Country|M|Camisetas|79.9|99.9|pb|o
Calça Jeans Reta Masculina|M|Calças Jeans|189.9|0|ac|v
Calça Jeans Slim Masculina|M|Calças Jeans|179.9|229.9|a|o
Bermuda Jeans Country|M|Bermudas|129.9|0|ac|n
Jaqueta Jeans Country|M|Jaquetas|249.9|299.9|ac|no
Jaqueta Couro Rural|M|Jaquetas|349.9|0|c|v
Bota Texana Masculina|M|Botas|389.9|449.9|c|vo
Bota Country Couro Masculina|M|Botas|329.9|0|pc|n
Chapéu de Couro Masculino|M|Chapéus|159.9|0|ce|v
Cinto Couro Legítimo|M|Cintos|99.9|129.9|pc|o
Vestido Country Midi|F|Vestidos|179.9|0|epb|v
Vestido Xadrez Rural|F|Vestidos|169.9|219.9|pe|no
Saia Jeans Country|F|Saias|119.9|0|a|v
Saia Midi Rústica|F|Saias|109.9|139.9|eb|o
Blusa Country Bordada|F|Blusas|99.9|0|be|n
Blusa Xadrez Feminina|F|Blusas|89.9|119.9|pb|o
Calça Jeans Feminina Reta|F|Calças Jeans|179.9|0|a|v
Calça Jeans Flare Feminina|F|Calças Jeans|189.9|239.9|ac|no
Short Jeans Country|F|Shorts|89.9|0|a|v
Bota Country Feminina|F|Botas|349.9|399.9|c|vo
Bota Cano Curto Feminina|F|Botas|299.9|0|pc|n
Chapéu Palha Feminino|F|Chapéus|129.9|0|e|v
Chapéu de Couro Feminino|F|Chapéus|149.9|189.9|c|o`.split('\n').map((l,i)=>{const[n,g,c,p,d,co,t]=l.split('|');return{id:i,n,g,c,p:+p,d:+d,co:[...co.toLowerCase()].map(k=>CM[k][0]),t,s:c=='Botas'?SH[g]:(c=='Chapéus'||c=='Cintos')?['Único']:['P','M','G','GG'],ds:DS[c]}});
let S={v:'home',g:'',c:'',o:'',q:'',sz:new Set,co:new Set,mx:450,so:''},M={},cart=[];
try{cart=JSON.parse(localStorage.getItem('gs-cart')||'[]')}catch(e){}
const sv=()=>{try{localStorage.setItem('gs-cart',JSON.stringify(cart))}catch(e){}$('#cn').textContent=cart.reduce((a,i)=>a+i.q,0)};
const art=(p,cn)=>`<svg viewBox="0 0 100 100"><path d="${PA[p.c]}" fill="${CH[cn]}" stroke="rgba(0,0,0,.3)" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
function toast(t){const e=$('#ts');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
function card(p){const off=p.d>p.p;return`<article class="card" onclick="op(${p.id})"><div class="ph">${art(p,p.co[0])}${off?`<b class="bd">-${Math.round((1-p.p/p.d)*100)}%</b>`:p.t.includes('n')?'<b class="bd">NOVO</b>':''}</div><div class="ci"><small>${p.g=='M'?'Masculino':'Feminino'} · ${p.c}</small><h3>${p.n}</h3><div class="pr">${R(p.p)}${off?`<s>${R(p.d)}</s>`:''}</div><div class="dots">${p.co.map(c=>`<i style="background:${CH[c]}"></i>`).join('')}</div></div></article>`}
function go(v,g,c,o){S.v=v;S.g=g||'';S.c=c||'';S.o=o||'';S.q='';$('#q').value='';S.sz.clear();S.co.clear();S.mx=450;render();scrollTo(0,0)}
function sq(v){S.q=v;if(v&&S.v!='shop'){S.v='shop';S.g=S.c=S.o=''}if(!v&&S.v=='shop'&&!S.g&&!S.c&&!S.o)S.v='home';render()}
function sec(t,tag,n){const l=DATA.filter(p=>tag=='o'?p.d>p.p:p.t.includes(tag)).slice(0,n||4);return`<section class="sec"><div class="sh"><h2>${t}</h2><button onclick="go('shop','','','${tag}')">Ver tudo</button></div><div class="grid g4">${l.map(card).join('')}</div></section>`}
function render(){$('#app').innerHTML=S.v=='home'?`<div class="hero"><div class="eb">NOVA COLEÇÃO COUNTRY 2026</div><h1>Estilo autêntico.<br><em>Espírito country.</em></h1><p>Moda country para ele e para ela, com qualidade, conforto e a atitude de quem vive o campo.</p><button class="btn" onclick="go('shop','','','n')">Ver novidades</button> <button class="btn o" onclick="go('shop','','','o')">Ofertas</button></div><div class="wrap"><div class="tiles"><button class="tile" onclick="go('shop','M')">Masculino</button><button class="tile" onclick="go('shop','F')">Feminino</button></div>${sec('Novidades','n')}${sec('Ofertas','o')}${sec('Mais vendidos','v')}<div class="ben"><div><b>Couro legítimo</b>botas e cintos selecionados</div><div><b>Compra segura</b>seus dados protegidos</div><div><b>Atendimento no WhatsApp</b>finalize seu pedido com a gente</div></div></div>`:shop()}
function shop(){let l=DATA.filter(p=>(!S.g||p.g==S.g)&&(!S.c||p.c==S.c)&&(!S.o||(S.o=='o'?p.d>p.p:p.t.includes(S.o)))&&(!S.sz.size||p.s.some(x=>S.sz.has(x)))&&(!S.co.size||p.co.some(x=>S.co.has(x)))&&p.p<=S.mx&&(!S.q||(p.n+p.c).toLowerCase().includes(S.q.toLowerCase())));
if(S.so)l.sort((a,b)=>S.so=='a'?a.p-b.p:b.p-a.p);
const t=S.q?`Busca: “${S.q}”`:S.o=='o'?'Ofertas':S.o=='n'?'Novidades':S.o=='v'?'Mais vendidos':S.g=='M'?'Masculino':S.g=='F'?'Feminino':'Todos os produtos';
const sizes=['P','M','G','GG','Único','35','36','37','38','39','40','41','42','43'],cols=Object.values(CM);
return`<div class="wrap"><h1 style="font-size:38px;margin:20px 0 0">${t}</h1><div class="shop"><aside id="fl"><h4>Categoria</h4><button class="cl ${!S.c&&!S.g?'on':''}" onclick="go('shop')">Todas</button>${['M','F'].map(g=>`<button class="cl ${S.g==g&&!S.c?'on':''}" onclick="go('shop','${g}')"><b>${g=='M'?'Masculino':'Feminino'}</b></button>${CATS[g].map(c=>`<button class="cl ${S.g==g&&S.c==c?'on':''}" style="padding-left:12px" onclick="go('shop','${g}','${c}')">${c}</button>`).join('')}`).join('')}<h4>Tamanho</h4>${sizes.map(s=>`<button class="ch ${S.sz.has(s)?'on':''}" onclick="tg('sz','${s}')">${s}</button>`).join('')}<h4>Cor</h4>${cols.map(([n,h])=>`<button class="sw ${S.co.has(n)?'on':''}" title="${n}" style="background:${h}" onclick="tg('co','${n}')"></button>`).join('')}<h4>Preço até <span id="pv">${R(S.mx)}</span></h4><input type="range" min="60" max="450" step="10" value="${S.mx}" style="width:100%" oninput="$('#pv').textContent=R(+this.value)" onchange="S.mx=+this.value;render()"></aside><div><div class="bar"><button class="btn o ft" onclick="$('#fl').classList.toggle('open')">Filtros</button><span style="color:var(--mut)">${l.length} produto(s)</span><select onchange="S.so=this.value;render()"><option value="">Ordenar</option><option value="a" ${S.so=='a'?'selected':''}>Menor preço</option><option value="d" ${S.so=='d'?'selected':''}>Maior preço</option></select></div><div class="grid" style="margin-top:14px">${l.length?l.map(card).join(''):'<p>Nenhum produto encontrado com esses filtros.</p>'}</div></div></div></div>`}
function tg(k,v){S[k].has(v)?S[k].delete(v):S[k].add(v);const o=$('#fl').classList.contains('open');render();if(o)$('#fl').classList.add('open')}
function op(id){M={id,sz:'',co:DATA[id].co[0]};dm();$('#mo').classList.add('on')}
function dm(){const p=DATA[M.id],off=p.d>p.p;$('#md').innerHTML=`<button class="x" onclick="cl()">✕</button><div class="ph">${art(p,M.co)}</div><div class="mi"><small style="color:var(--mut)">${p.g=='M'?'Masculino':'Feminino'} · ${p.c}</small><h2>${p.n}</h2><div class="pr" style="font-size:22px">${R(p.p)}${off?`<s>${R(p.d)}</s>`:''}</div><p>${p.ds}</p><b>Tamanho</b><div style="margin-top:6px">${p.s.map(s=>`<button class="ch ${M.sz==s?'on':''}" onclick="M.sz='${s}';dm()">${s}</button>`).join('')}</div><b>Cor: ${M.co}</b><div style="margin-top:6px">${p.co.map(c=>`<button class="sw ${M.co==c?'on':''}" style="background:${CH[c]}" title="${c}" onclick="M.co='${c}';dm()"></button>`).join('')}</div><div class="row"><button class="btn" onclick="ad(1)">Comprar agora</button><button class="btn o" onclick="ad(0)">Adicionar ao carrinho</button></div></div>`}
function ad(now){const p=DATA[M.id];if(!M.sz&&p.s.length==1)M.sz=p.s[0];if(!M.sz)return toast('Escolha um tamanho');const it=cart.find(i=>i.id==M.id&&i.sz==M.sz&&i.co==M.co);it?it.q++:cart.push({id:M.id,sz:M.sz,co:M.co,q:1});sv();cl();now?ock():(oc(),toast('Adicionado ao carrinho'))}

const sub=()=>cart.reduce((a,i)=>a+DATA[i.id].p*i.q,0);
